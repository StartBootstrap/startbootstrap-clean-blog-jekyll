---
layout: page
title: Contact Me
description: Have questions? I have answers.
background: "/img/bg-contact.jpg"
form: true
---

<p class="mb-5 text-center px-4">
  Want to get in touch? Fill out the form below to send me a message and I will
  get back to you as soon as possible!
</p>
<div class="row justify-content-center pb-5">
  <div class="col-md-10 col-lg-8">
    <form name="sentMessage" id="contactForm" class="p-4" style="background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);" novalidate>
      <div class="control-group">
        <div class="form-group floating-label-form-group controls">
          <label>Name</label>
          <input
            type="text"
            class="form-control"
            placeholder="Name"
            id="name"
            required
            data-validation-required-message="Please enter your name."
          />
          <p class="help-block text-danger"></p>
        </div>
      </div>
      <div class="control-group">
        <div class="form-group floating-label-form-group controls">
          <label>Email Address</label>
          <input
            type="email"
            class="form-control"
            placeholder="Email Address"
            id="email"
            required
            data-validation-required-message="Please enter your email address."
          />
          <p class="help-block text-danger"></p>
        </div>
      </div>
      <div class="control-group">
        <div class="form-group col-xs-12 floating-label-form-group controls">
          <label>Phone Number</label>
          <input
            type="tel"
            class="form-control"
            placeholder="Phone Number"
            id="phone"
            required
            data-validation-required-message="Please enter your phone number."
          />
          <p class="help-block text-danger"></p>
        </div>
      </div>
      <div class="control-group">
        <div class="form-group floating-label-form-group controls">
          <label>Message</label>
          <textarea
            rows="5"
            class="form-control"
            placeholder="Message"
            id="message"
            required
            data-validation-required-message="Please enter a message."
          ></textarea>
          <p class="help-block text-danger"></p>
        </div>
      </div>
      <br />
      <div id="success"></div>
      <div class="form-group text-center mt-3">
        <button type="submit" class="btn btn-primary btn-lg" id="sendMessageButton">
          Send Message
        </button>
      </div>
    </form>
  </div>
</div>
